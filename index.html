function recordsView(short=false){const list=filtered().filter(b=>b.kind!=='forecast');const size=short?5:Number(state.settings.pageSize);const pages=Math.max(1,Math.ceil(list.length/size));currentPage=Math.min(currentPage,pages);const shown=list.slice((currentPage-1)*size,currentPage*size);return `<section class="panel"><div class="records-heading"><h2>${short?'最近投注':'全部投注'}<span>${list.length}</span></h2>${short?'<button class="text-link" data-page="records">查看全部 →</button>':`<button class="text-link" data-action="backup">${icon('download')} JSON 備份</button>`}</div>${filterBar()}<div class="table-scroll"><table><thead><tr><th>賽事日期</th><th>對賽球隊／聯賽</th><th>投注內容</th><th>賠率</th><th>投注金額</th><th>比分</th><th>結果</th><th>淨盈虧</th><th>AI 預判</th><th><span class="muted">操作</span></th></tr></thead><tbody>${shown.length?shown.map(b=>{const r=settle(b);return `<tr><td data-label="日期" class="numeric">${esc(b.date)}${b.matchTime?` · ${esc(b.matchTime)}`:''}<small>${b.timing==='pre'?'賽前投注':'走地投注'}</small></td><td data-label="對賽／聯賽"><div class="match-cell"><div class="sport-symbol">${icon(b.sport)}</div><div>${b.kind==='parlay'?parlaySummary(b):`<strong>${esc(b.home)}<span class="versus">vs</span>${esc(b.away)}</strong>`}<small>${esc(b.league)} · ${sportName(b.sport)}</small></div></div></td><td data-label="投注內容">${esc(b.marketName)}${b.timing==='live'?'<span class="live-tag">走地</span>':''}<small>${esc(b.team)} ${esc(b.line)}${b.betPeriod==='half'?' · 上半場':''}</small></td><td data-label="賠率" class="numeric"><span class="odds-value">${b.kind==='parlay'?'組合':(Number(b.odds)+(b.oddsFormat==='hongkong'?1:0)).toFixed(2)}</span><small>歐洲十進制</small></td><td data-label="金額" class="numeric">${money(b.stake)}</td><td data-label="比分" class="numeric">${b.homeScore!==''&&b.homeScore!=null?`${b.homeScore} : ${b.awayScore}`:'—'}${has(b.halfHome)?`<small>半場 ${b.halfHome} : ${b.halfAway}</small>`:''}</td><td data-label="結果">${b.kind==='parlay'?`<span>${r.profit===null?'待結算':r.result==='void'?'取消':r.profit>0?'淨盈利':r.profit<0?'淨虧損':'收支平衡'}</span>`:resultBadge(r.result)}</td><td data-label="淨盈虧" class="numeric ${r.profit<0?'negative':r.profit>0?'positive':''}">${r.profit===null?'—':money(r.profit,true)}</td><td data-label="AI 預判">${aiBadge(b)}</td><td data-label="操作"><button class="icon quiet" data-edit="${esc(b.id)}" aria-label="編輯 ${esc(b.home)} 對 ${esc(b.away)}" title="編輯及結算">${icon('edit')}</button></td></tr>`}).join(''):`<tr><td colspan="10"><div class="empty"><h3>${source().length?'找不到符合條件的記錄':'你的第一筆記錄，從這裡開始'}</h3><p>${source().length?'試試更改日期或搜尋條件。':'新增投注，記錄判斷，再用賽果驗證。'}</p><button data-action="${source().length?'reset':'new'}">${source().length?'清除篩選':'＋ 新增投注'}</button></div></td></tr>`}</tbody></table></div><div class="table-footer"><span>顯示 ${list.length?(currentPage-1)*size+1:0}–${Math.min(currentPage*size,list.length)} 筆，共 ${list.length} 筆記錄</span><div class="pagination"><button data-paginate="-1" ${currentPage===1?'disabled':''} aria-label="上一頁">‹</button><span>${currentPage} / ${pages}</span><button data-paginate="1" ${currentPage>=pages?'disabled':''} aria-label="下一頁">›</button></div></div></section>`;}
function predictionText(b){if(b.predictionType==='winner')return '預估賽果：'+({home:b.home,away:b.away,draw:'和局'}[b.predictedSide]||'—');if(b.predictionType==='score')return `預估比分：${b.predictedHome} : ${b.predictedAway}`;if(b.predictionType==='total')return `預估總分：${b.predictedSide==='over'?'大於':'小於'} ${b.predictedTotal}`;return '文字分析 · 手動評核';}
function legacyaiView(){const list=filtered().filter(b=>b.analysis||b.predictionType),s=stats(list);const pending=list.filter(b=>['pending','unrated'].includes(prediction(b).status)).length;return `<div class="cards">${card('預估準確率',percent(s.aiRate),`${s.evaluated} 筆已判定準確／不準確的預估`,'spark','positive')}${card('已記錄預估',list.length,'保留當時的判斷與分析','list')}${card('準確預估',list.filter(b=>prediction(b).status==='correct').length,'符合已設定的可驗證條件','target')}${card('待驗證／評核',pending,'賽果未輸入，或文字待評核','clock')}</div><div class="method-note"><strong>覆盤方式</strong>　貼入 AI 分析，再指定賽果、精確比分或大小條件即可自動驗證；純文字分析可手動評核。準確率只計「準確／不準確」，不計部分準確、持平及取消。此系統不會自行生成分析。</div>${filterBar()}<div class="review-grid">${list.map(b=>`<article class="panel review-card"><header><div><h2>${esc(b.home)} <span class="muted" style="font-size:11px">vs</span> ${esc(b.away)}</h2><p class="muted" style="font-size:10px;margin-top:5px">${b.date} · ${esc(b.league)} · ${sportName(b.sport)}</p></div>${aiBadge(b)}</header><div class="analysis">${esc(b.analysis||'未填寫文字分析')}</div><p style="font-size:11px;color:#748596">${esc(predictionText(b))}</p>${b.review?`<p style="margin-top:10px;font-size:11px;color:#8995a3;white-space:pre-wrap">覆盤：${esc(b.review)}</p>`:''}<footer style="margin-top:15px"><span>最終比分 ${b.homeScore!==''&&b.homeScore!=null?`${b.homeScore} : ${b.awayScore}`:'待定'} · ${RESULTS[settle(b).result]}</span><button class="text-link" data-edit="${esc(b.id)}">查看及評核 →</button></footer></article>`).join('')||'<div class="panel empty full"><h3>讓每一次預判，都有跡可循</h3><p>新增投注時貼入 AI 分析，並選擇可驗證的預估條件。</p><button data-action="new">新增預估記錄</button></div>'}</div>`;}
function settingsView(){const s=state.settings,sp=settingsSport;return `<section class="panel branding-panel"><div class="settings-section-title">${icon('edit')}<div><h2>系統名稱</h2><p>把這個工作台，命名為你自己的系統。</p></div></div><form id="branding-form"><div class="branding-fields"><div class="field"><label for="systemName">自訂名稱</label><input id="systemName" name="systemName" maxlength="40" required value="${esc(systemName())}" placeholder="例如：我的賽事研究室" aria-describedby="name-help"><small id="name-help">1–40 個字，會套用至頁首、瀏覽器分頁及匯出檔名；名稱亦會包含在 JSON 備份內。</small></div><button type="submit" class="primary">${icon('check')}儲存名稱</button></div><div class="brand-preview"><span class="preview-label">名稱預覽</span>${brandMark()}<strong id="brand-preview-name">${esc(systemName())}</strong></div><p id="branding-error" class="form-error" role="alert"></p></form></section><section class="panel settings-general"><div><h2>一般偏好</h2><p class="muted" style="font-size:11px;margin-top:5px">預設賠率格式只影響新記錄；幣別僅為顯示標籤，不作匯率換算。</p></div><div class="field"><label for="currency">記帳幣別</label><select id="currency">${selectOptions(['HKD','MOP','CNY','USD'],s.currency)}</select></div><div class="field"><label for="defaultOdds">預設賠率</label><select id="defaultOdds">${selectOptions([['decimal','歐洲十進制']],'decimal')}</select></div></section><div class="toolbar"><div class="sport-tabs">${['football','basketball'].map(sp=>`<button class="${settingsSport===sp?'active':''}" data-settings-sport="${sp}">${icon(sp)}${sportName(sp)}</button>`).join('')}</div><span class="muted" style="font-size:10px">刪改設定不會更改已保存的投注記錄</span></div><div class="settings-grid"><section class="panel setting-panel"><h2>${sportName(sp)}聯賽</h2><p>管理新增投注時可選擇的賽事種類。</p><div class="setting-list">${s.leagues[sp].map((l,i)=>`<div class="setting-row"><span>${esc(l)}</span><div class="row"><button class="icon quiet" data-edit-league="${i}" title="重新命名" aria-label="重新命名 ${esc(l)}">${icon('edit')}</button><button class="icon quiet danger" data-delete-league="${i}" title="刪除聯賽" aria-label="刪除 ${esc(l)}">${icon('trash')}</button></div></div>`).join('')}</div><form id="league-form" class="add-line"><input name="name" required maxlength="60" placeholder="例如：葡超、日職聯…" aria-label="新聯賽名稱"><button type="submit">${icon('plus')}新增</button></form></section><section class="panel setting-panel"><h2>${sportName(sp)}投注種類</h2><p>每種投注可指定適用時間及比分結算規則。</p><div class="setting-list">${s.markets[sp].map((m,i)=>`<div class="setting-row"><div>${esc(m.name)}<small>${esc(RULES[m.rule])} · ${m.timings.map(t=>t==='pre'?'賽前':'走地').join('、')}</small></div><div class="row"><button class="icon quiet" data-edit-market="${i}" aria-label="編輯 ${esc(m.name)}" title="編輯投注種類">${icon('edit')}</button><button class="icon quiet danger" data-delete-market="${i}" aria-label="刪除 ${esc(m.name)}" title="刪除投注種類">${icon('trash')}</button></div></div>`).join('')}</div><form id="market-form" class="add-market"><input name="name" required maxlength="60" placeholder="投注種類名稱" aria-label="新投注種類名稱"><select name="rule" aria-label="結算規則">${selectOptions(Object.entries(RULES),'handicap')}</select><div class="row"><label class="check-label"><input type="checkbox" name="pre" checked>適用賽前</label><label class="check-label"><input type="checkbox" name="live" checked>適用走地</label><button type="submit" style="margin-left:auto">${icon('plus')}新增種類</button></div></form></section><section class="panel setting-panel full"><h2>資料備份與還原</h2><p style="margin:8px 0 16px">資料只保存在此瀏覽器。清除網站資料、使用私密瀏覽或更換裝置，可能無法取回記錄。JSON 備份包含所有投注及設定；CSV 適合試算表分析。</p><div class="row" style="flex-wrap:wrap"><button data-action="backup">${icon('download')}下載 JSON 備份</button><button data-action="import">${icon('upload')}還原 JSON 備份</button><button data-action="csv">${icon('download')}匯出 CSV</button><button data-action="demo" class="quiet">查看示範資料</button></div><p style="margin-top:12px">還原前會顯示記錄數量，經確認後才取代目前資料。新舊檔案不會自動合併。</p></section></div>`;}
const field=(label,name,type,value,placeholder='',extra='')=>`<div class="field ${extra}"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${['number'].includes(type)?'step="any"':''}></div>`;
const choice=(label,name,options,value,extra='')=>`<div class="field ${extra}"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${selectOptions(options,value)}</select></div>`;
function oldBlankBet(){const sp=sport==='all'?state.settings.defaultSport:sport;const m=state.settings.markets[sp][0];return {sport:sp,date:today(),league:state.settings.leagues[sp][0],home:'',away:'',timing:m.timings[0],marketId:m.id,marketName:m.name,rule:m.rule,team:'',side:m.rule==='total'?'over':'home',line:'',oddsFormat:state.settings.oddsFormat,odds:'',stake:state.settings.defaultStake,basis:'full',scoreScope:sp==='football'?'regular':'overtime',liveHome:'',liveAway:'',homeScore:'',awayScore:'',override:'',manualResult:'win',manualReason:'',analysis:'',predictionType:'',predictedSide:'home',predictedHome:'',predictedAway:'',predictedTotal:'',aiReview:'unrated',review:''};}
function blankBet(){const b=oldBlankBet();b.oddsFormat='decimal';b.matchTime='';applyMarket(b,state.settings.markets[b.sport][0]);return b;}
function openEditor(id){if(demo&&id){toast('這是示範記錄，可查看但不會儲存。');editing=clone(demoBets.find(b=>b.id===id));}else{if(demo){demo=false;render();}editing=id?clone(state.bets.find(b=>b.id===id)):blankBet();}if(!editing)return;modalDirty=false;renderEditor();$('#editor').showModal();}

sFormat',[['decimal','歐洲十進制'],['hongkong','香港盤']],b.oddsFormat)}${field('投注賠率','odds','number',b.odds,b.oddsFormat==='decimal'?'例如 1.90':'例如 0.90')}${field('投注金額（'+currency()+'）','stake','number',b.stake,'例如 1000')}${choice('比分範圍','scoreScope',[['regular','法定時間（足球 90 分鐘／籃球不含加時）'],['overtime','包含加時（不含互射十二碼）']],b.scoreScope)}${b.timing==='live'?`${choice('走地結算基準','basis',[['full','全場最終比分'],['remaining','投注後剩餘賽事比分']],b.basis,'full')}${b.basis==='remaining'?`${field('落盤時主隊比分','liveHome','number',b.liveHome,'0')}${field('落盤時客隊比分','liveAway','number',b.liveAway,'0')}<div class="help-box full">系統會以「最終比分 − 落盤時比分」計算讓球、大小及勝負結果。</div>`:''}`:''}</div></section><section class="form-section"><div class="section-title"><span>03</span>賽果及結算</div><div class="form-grid">${field('最終主隊比分','homeScore','number',b.homeScore,'待賽事完結')}${field('最終客隊比分','awayScore','number',b.awayScore,'待賽事完結')}<div class="help-box full">請輸入符合上方「比分範圍」的比分。只憑一組比分無法分辨加時或法定時間，請先確認比賽及投注規則。</div>${choice('結算方式','override',[['','按比分自動結算'],['manual','手動結算'],['void','取消／投注作廢']],b.override||'','full')}${b.override==='manual'?`${choice('手動投注結果','manualResult',Object.entries(RESULTS).filter(([v])=>['win','halfWin','push','halfLoss','loss'].includes(v)),b.manualResult)}${field('手動結算原因','manualReason','text',b.manualReason,'請說明特殊結算原因')}`:''}</div><div id="settle-preview"></div></section><section class="form-section"><div class="section-title"><span>04</span>AI 預估及覆盤</div><div class="form-grid"><div class="field full"><label for="f-analysis">賽前／落盤時 AI 分析</label><textarea id="f-analysis" name="analysis" placeholder="貼入 AI 對賽事的分析、預期走勢及判斷依據…">${esc(b.analysis)}</textarea><small>此欄用於保存分析；系統不會連線 AI 或自行產生預測。</small></div>${choice('預估驗證方式','predictionType',[['','不設定'],['winner','最終賽果（主勝／客勝／和局）'],['score','精確比分'],['total','全場總分大小'],['manual','文字分析，手動評核']],b.predictionType,'full')}${b.predictionType==='winner'?choice('預估賽果','predictedSide',[['home','主勝'],['away','客勝'],['draw','和局']],b.predictedSide,'full'):''}${b.predictionType==='s function updatePreview(){const b=readForm();const r=settle(b);const p=prediction(b);$('#settle-preview').innerHTML=`<div class="settle-preview"><div>${resultBadge(r.result)}<small>${esc(r.explanation)}</small>${b.analysis||b.predictionType?`<small>AI 預判：${p.label}</small>`:''}</div><div class="numeric ${r.profit<0?'negative':'positive'}" style="font-size:20px">${r.profit===null?'—':money(r.profit,true)}<small style="text-align:right">淨盈虧 · ${currency()}</small></div></div>`;}
function closeModal(){if(modalBusy)return;if(modalDirty&&!String(editing?.id||'').startsWith('demo-')&&!confirm('尚有未儲存的變更。確定關閉？'))return;$('#editor').close();editing=null;modalDirty=false;}
function saveBet(addNext=false){if(storageError){$('#form-error').textContent='請先備份原始資料並還原有效備份，避免覆寫現有記錄。';return;}try{const b=readForm();if(String(b.id||'').startsWith('demo-'))return;validateBet(b);b.id=b.id||crypto.randomUUID();b.createdAt=b.createdAt||new Date().toISOString();b.updatedAt=new Date().toISOString();const next=clone(state);const i=next.bets.findIndex(x=>x.id===b.id);if(i<0)next.bets.push(b);else next.bets[i]=b;if(!persist(next))return;demo=false;modalDirty=false;$('#editor').close();editing=null;render();if(addNext){editing=sameMatchBet(b);renderEditor();$('#editor').showModal();toast('已儲存本注，可繼續新增同場投注');return;}toast('記錄已儲存'+(settle(b).profit!==null?'，結算結果已更新。':'，可於賽後補上比分。'));}catch(e){$('#form-error').textContent=e.message;$('.dialog-scroll').scrollTo({top:0,behavior:'smooth'});}}

function download(content,name,type){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}

function legacyexportCSV(){const list=filtered();if(!list.length){toast('目前篩選下沒有可匯出的投注。');return;}const heading=['賽事日期','運動','聯賽','主隊','客隊','落盤時間','投注種類','投注球隊或選項','方向','盤口','賠率格式','賠率','投注金額','幣別','比分範圍','結算基準','落盤主隊比分','落盤客隊比分','最終主隊比分','最終客隊比分','投注結果','淨盈虧','結算說明','AI分析','預估類型','預估內容','預估準確度','覆盤筆記'];const rows=list.map(b=>{const r=settle(b);return[b.date,sportName(b.sport),b.league,b.home,b.away,b.timing==='pre'?'賽前':'走地',b.marketName,b.team,b.side,b.line,b.oddsFormat==='decimal'?'歐洲十進制':'香港盤',b.odds,b.stake,currency(),b.scoreScope==='regular'?'法定時間':'包含加時',b.basis==='remaining'?'剩餘賽事':'全場',b.liveHome,b.liveAway,b.homeScore,b.awayScore,RESULTS[r.result],r.profit??'',r.explanation,b.analysis,b.predictionType,predictionText(b),prediction(b).label,b.review];});const cell=x=>{let s=String(x??'');if(/^[\s]*[=+@-]/.test(s)&&!/^[-+]?\d+(\.\d+)?$/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};download('\ufeff'+[heading,...rows].map(row=>row.map(cell).join(',')).join('\r\n'),`${fileStem()}-${demo?'demo-':''}${today()}.csv`,'text/csv;charset=utf-8');toast('已匯出目前篩選的 '+list.length+' 筆記錄。');}
function importBackup(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.addEventListener('change',async()=>{const file=input.files[0];if(!file)return;try{if(file.size>20000000)throw Error('檔案超過 20 MB');const parsed=JSON.parse(await file.text());if(parsed.app!=='matchledger'||parsed.schemaVersion!==1||!Array.isArray(parsed.bets)||parsed.bets.length>20000)throw Error('這不是受支援的投注系統備份檔');parsed.settings=normalizeSettings(parsed.settings);parsed.bets.forEach(b=>{validateBet(b);if(typeof b.id!=='string'||!b.id||b.id.startsWith('demo-')||b.id.length>100)throw Error('備份內含無效記錄識別碼');});if(new Set(parsed.bets.map(b=>b.id)).size!==parsed.bets.length)throw Error('備份含重複記錄');if(!confirm(`備份包含 ${parsed.bets.length} 筆投注及設定。還原將取代目前 ${state.bets.length} 筆投注及設定，並不會合併。請先下載現有資料備份。確定還原？`))return;if(persist({bets:parsed.bets,settings:parsed.settings},true)){storageError='';demo=false;resetFilters();render();toast('已還原 '+parsed.bets.length+' 筆投注。');}}catch(e){toast('還原失敗：'+e.message);}});input.click();}

function showHelp(){editing=null;modalDirty=false;$('#editor').innerHTML=`<div class="dialog-shell"><header class="dialog-head"><h2 id="editor-title">${esc(systemName())} · 使用說明</h2><button class="icon quiet" data-action="close-modal" aria-label="關閉">${icon('close')}</button></header><div class="dialog-scroll"><section class="form-section"><h2>1. 記錄 → 結算 → 覆盤</h2><p style="margin-top:12px">新增投注時填妥賽事、盤口、賠率與金額。賽後編輯同一筆記錄並輸入比分，系統會即時計算結果及淨盈虧。</p></section><section class="form-section"><h2>2. 盈虧計算</h2><p style="margin-top:12px">歐洲十進制：全贏淨利＝本金 ×（賠率 − 1）。香港盤：全贏淨利＝本金 × 賠率。贏半只計一半本金的淨利；輸半虧損一半本金；走盤及取消淨盈虧為零。四分之一盤會等分成相鄰的兩個半盤。</p><p style="margin-top:12px">例如：投注 1,000、歐洲賠率 1.90，全贏 +900、贏半 +450、走盤 0、輸半 −500、全輸 −1,000。金額四捨五入至兩位小數。</p></section><section class="form-section"><h2>3. 統計口徑</h2><p style="margin-top:12px">ROI＝淨盈虧 ÷ 已結算投注本金，包含走盤、不含取消。勝率＝全贏及贏半筆數 ÷ 有勝負筆數，不含走盤與取消。AI 準確率只計準確及不準確的預估，與投注勝率分開計算。</p></section><section class="form-section"><h2>4. 走地及比分範圍</h2><p style="margin-top:12px">「全場」用最終比分結算；「剩餘賽事」會扣除落盤時比分。請按照實際投注規則選擇法定時間或包含加時，並輸入相應比分。特殊玩法可在設定選手動結算。</p></section><section class="form-section"><h2>5. 本機資料與備份</h2><p style="margin-top:12px">本 PWA 不會傳送投注資料至任何伺服器。首次連線完成離線準備後，可從主畫面離線開啟。記錄按瀏覽器及網站網址保存，不會跨裝置同步。請定期下載 JSON 備份。由本機 HTML 搬到 GitHub Pages 時，先備份再到新網址還原。以 file:// 開啟時，不同瀏覽器的保存行為可能不同。</p></section><section class="form-section"><h2>6. 賽前分析的保存</h2><p style="margin-top:12px">可貼入 AI 分析及指定預估條件。記錄可隨時編輯，並非不可更改的時間戳證明；建議在賽前備份，以保留當時的預判。</p></section></div></div>`;$('#editor').showModal();}

 if(name==='kind'||name==='system'||m){const scroll=$('.dialog-scroll').scrollTop;renderEditor();$('.dialog-scroll').scrollTop=scroll;}else updatePreview();
},true);

document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='branding-form'){const next=clone(state.settings);next.systemName=String(new FormData(f).get('systemName')||'').trim();try{validateSettings(next);saveSettings(next);}catch(error){$('#branding-error').textContent=error.message;}return;}if(f.id==='bet-form'){saveBet();return;}if(f.id==='league-form'){const next=clone(state.settings);next.leagues[settingsSport].push(new FormData(f).get('name').trim());saveSettings(next);}if(f.id==='market-form'){const fd=new FormData(f),next=clone(state.settings);next.markets[settingsSport].push({id:crypto.randomUUID(),name:fd.get('name').trim(),rule:fd.get('rule'),timings:['pre','live'].filter(t=>fd.has(t))});saveSettings(next);}if(f.id==='edit-market-form'){const fd=new FormData(f),next=clone(state.settings),i=Number(f.dataset.index);next.markets[settingsSport][i]={...next.markets[settingsSport][i],name:fd.get('name').trim(),rule:fd.get('rule'),timings:['pre','live'].filter(t=>fd.has(t))};if(saveSettings(next)){$('#editor').close();modalDirty=false;}}});
document.addEventListener('change',e=>{const el=e.target;if(el.closest('#bet-form')){modalDirty=true;editing=readForm();const b=editing;if(['sport','timing','marketId','basis','override','predictionType'].includes(el.name)){
 if(el.name==='sport'){b.league=state.settings.leagues[b.sport][0];b.scoreScope=b.sport==='football'?'regular':'overtime';}
 if(['sport','timing'].includes(el.name)){const matches=state.settings.markets[b.sport].filter(m=>m.timings.includes(b.timing));const m=matches[0];b.marketId=m?.id||'';b.marketName=m?.name||'';b.rule=m?.rule||'manual';b.side=b.rule==='total'?'over':'home';applyMarket(b,m);}
 if(el.name==='marketId'){const m=marketOptions(b).find(m=>m.id===b.marketId);if(m){b.marketName=m.name.replace('（原記錄）','');b.rule=m.rule;b.side=m.rule==='total'?'over':'home';applyMarket(b,m);}}
 if(el.name==='predictionType')b.predictedSide=b.predictionType==='total'?'over':'home';
 const sc=$('.dialog-scroll').scrollTop;renderEditor();$('.dialog-scroll').scrollTop=sc;
 }else if(el.name==='side'){if(!b.team||['大','小','和局',b.home,b.away].includes(b.team)){b.team=({home:b.home,away:b.away,draw:'和局',over:'大',under:'小'})[b.side];b.team=b.team||sideOptions(b).find(x=>x[0]===b.side)?.[1]||'投注選項';$('#f-team').value=b.team;}updatePreview();}else updatePreview();return;}
 if(el.closest('#edit-market-form')){modalDirty=true;return;}
 if(el.id==='period'){period=el.value;currentPage=1;render();}if(el.id==='dateFrom'||el.id==='dateTo'){if(el.id==='dateFrom')dateFrom=el.value;else dateTo=el.value;if(dateFrom&&dateTo&&dateFrom>dateTo){toast('開始日期不可晚於結束日期。');if(el.id==='dateFrom')dateFrom='';else dateTo='';}currentPage=1;render();}if(el.id==='leagueFilter'){leagueFilter=el.value;currentPage=1;render();}if(el.id==='statusFilter'){statusFilter=el.value;currentPage=1;render();}if(el.id==='currency'||el.id==='defaultOdds'){const next=clone(state.settings);next[el.id==='currency'?'currency':'oddsFormat']=el.value;saveSettings(next);}
});
document.addEventListener('input',e=>{if(e.target.id==='systemName'){$('#brand-preview-name').textContent=e.target.value.trim()||'你的系統名稱';$('#branding-error').textContent='';}if(e.target.closest('#bet-form')){modalDirty=true;updatePreview();}if(e.target.id==='search'){search=e.target.value;currentPage=1;const caret=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(caret,caret);}});
function openMarketEditor(i){const m=state.settings.markets[settingsSport][i];editing=null;modalDirty=false;$('#editor').innerHTML=`<div class="dialog-shell"><header class="dialog-head"><h2 id="editor-title">編輯投注種類</h2><button class="icon quiet" data-action="close-modal" aria-label="關閉">${icon('close')}</button></header><div class="dialog-scroll"><form id="edit-market-form" data-index="${i}"><div class="form-grid">${field('投注種類名稱','name','text',m.name,'','full')}${choice('結算規則','rule',Object.entries(RULES),m.rule,'full')}<div class="row full"><label class="check-label"><input type="checkbox" name="pre" ${m.timings.includes('pre')?'checked':''}>適用賽前</label><label class="check-label"><input type="checkbox" name="live" ${m.timings.includes('live')?'checked':''}>適用走地</label></div><div class="help-box full">修改只影響日後新增的投注。既有投注會保留當時的名稱及結算規則。</div></div></form></div><footer class="dialog-foot"><button data-action="close-modal">取消</button><button class="primary" form="edit-market-form" type="submit">儲存設定</button></footer></div>`;$('#editor').showModal();}
$('#editor').addEventListener('cancel',e=>{e.preventDefault();closeModal();});
window.addEventListener('beforeunload',e=>{if(modalDirty){e.preventDefault();e.returnValue='';}});
window.addEventListener('storage',e=>{if(e.key===KEY){toast('資料在另一個分頁有所更新。請重新載入此頁，避免覆寫。');storageError='另一個分頁已更新資料，請重新載入此頁後再編輯';if(!$('#editor').open)render();}});

let pwaRegistration=null;
let offlineReady=false;
function mobileSettings(){return `<section class="panel setting-panel mobile-settings"><h2>iPhone 與使用偏好 <small>v4.5.0</small></h2><p>設定自動儲存；預設值只套用於新記錄。</p><div class="form-grid" style="margin-top:16px">
<div class="field"><label for="pref-sport">預設運動</label><select id="pref-sport" data-pref="defaultSport">${selectOptions([['football','足球'],['basketball','籃球']],state.settings.defaultSport)}</select></div>
<div class="field"><label for="pref-stake">預設投注金額（${currency()}）</label><input id="pref-stake" data-pref="defaultStake" type="number" inputmode="decimal" min="0.01" step="0.01" value="${esc(state.settings.defaultStake)}" placeholder="留空則每次填寫"></div>
<div class="field"><label for="pref-size">記錄每頁筆數</label><select id="pref-size" data-pref="pageSize">${selectOptions([10,20,50],state.settings.pageSize)}</select></div>
<div class="field"><label for="pref-cards">手機記錄顯示</label><select id="pref-cards" data-pref="mobileCards">${selectOptions([['true','卡片：免橫向捲動'],['false','表格：左右滑動']],String(state.settings.mobileCards))}</select></div></div>
<div class="pwa-info"><strong>安裝與離線</strong><p>以 Safari 開啟 HTTPS 網址 → 分享 → 加入主畫面（如有「作為網頁 App 開啟」，請開啟）。首次保持連線，待下方顯示「離線已準備」再測試飛航模式。</p><p id="pwa-status">${pwaStatus()}</p><div class="row wrap"><button data-mobile="update">檢查新版</button><button data-mobile="share">分享 JSON 備份</button><button data-mobile="storage">要求持續儲存</button></div><p>資料只保存在目前裝置／網站，不會自動同步。移至新網址或主畫面 App 後若記錄未帶入，請先在舊版匯出 JSON，再於新版還原。離線快取不等於資料備份。</p></div></section>`;}
function pwaStatus(){if(location.protocol==='file:')return '本機 HTML 預覽：請先部署至 HTTPS 網站，才可安裝及離線啟動。';return `${navigator.onLine?'目前連線':'目前離線'} · ${offlineReady?'離線已準備': '離線尚未準備，請保持連線'}${pwaRegistration?.waiting?' · 有新版可套用':''}`;}
function refreshPwaStatus(){const el=document.getElementById('pwa-status');if(el)el.textContent=pwaStatus();}
document.addEventListener('change',e=>{const key=e.target.dataset.pref;if(!key)return;const next=clone(state.settings);next[key]=key==='mobileCards'?e.target.value==='true':key==='pageSize'?Number(e.target.value):e.target.value;saveSettings(next);});
document.addEventListener('click',async e=>{const action=e.target.closest('[data-mobile]')?.dataset.mobile;if(!action)return;
 if(action==='update'){if(!pwaRegistration){toast('請於 HTTPS 網站連線後再試。');return;}try{await pwaRegistration.update();if(pwaRegistration.waiting)showUpdate();else toast('已檢查；如發現新版會顯示更新提示。');}catch{toast('檢查失敗，請確認網絡連線。');}}
 if(action==='storage'){try{const yes=await navigator.storage?.persist?.();toast(yes?'已獲准持續儲存，仍建議定期備份。':'瀏覽器未授予持續儲存；請定期匯出 JSON 備份。');}catch{toast('此瀏覽器不支援持續儲存申請。');}}
 if(action==='share'){const file=new File([JSON.stringify({app:'matchledger',schemaVersion:1,exportedAt:new Date().toISOString(),...state},null,2)],`${fileStem()}-backup-${today()}.json`,{type:'application/json'});try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'賽事覆盤備份'});}else backup();}catch(err){if(err.name!=='AbortError')toast('分享未完成，請使用「備份資料」下載。');}}
});
function showUpdate(){let bar=document.getElementById('update-banner');if(bar)return;bar=document.createElement('div');bar.id='update-banner';bar.innerHTML='<span>新版已就緒</span><button id="apply-update">儲存後更新</button><button id="dismiss-update" aria-label="稍後更新">稍後</button>';document.body.append(bar);document.getElementById('dismiss-update').onclick=()=>bar.remove();document.getElementById('apply-update').onclick=()=>{if(modalDirty||document.getElementById('editor').open){toast('請先儲存或關閉編輯視窗，再更新。');return;}pwaRegistration?.waiting?.postMessage({type:'SKIP_WAITING'});};}
async function initPWA(){
 if(!('serviceWorker' in navigator)||!window.isSecureContext||location.protocol==='file:')return;
 try{pwaRegistration=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});
 const probe=()=>navigator.serviceWorker.controller?.postMessage({type:'CHECK_READY'});
 navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.type==='CACHE_READY'){offlineReady=e.data.ready;refreshPwaStatus();}});
 let reloading=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading)return;if(pwaRegistration.waiting===null&&navigator.serviceWorker.controller){probe();}if(sessionStorage.getItem('review-updating')==='yes'){sessionStorage.removeItem('review-updating');reloading=true;location.reload();}});
 document.addEventListener('click',e=>{if(e.target.id==='apply-update'&&!modalDirty&&!document.getElementById('editor').open)sessionStorage.setItem('review-updating','yes');},true);
 await navigator.serviceWorker.ready;probe();if(pwaRegistration.waiting)showUpdate();
 pwaRegistration.addEventListener('updatefound',()=>{const worker=pwaRegistration.installing;worker?.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller)showUpdate();});});
 }catch{toast('離線準備未完成，請檢查部署檔案並重新連線。');}
}
window.addEventListener('online',refreshPwaStatus);window.addEventListener('offline',refreshPwaStatus);

render();
initPWA();

</script></body></html>
